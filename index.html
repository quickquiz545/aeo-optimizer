<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEO Optimizer</title>
  <style>
    :root{--bg:#f5f7f8;--surface:#fff;--ink:#18212b;--muted:#647181;--line:#d8e0e7;--accent:#0f766e;--high:#b42318;--medium:#a15c07;--low:#3b6d2a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
    header{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 24px}.bar{max-width:1120px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}
    .brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
    h1{margin:0;font-size:20px}.sub{color:var(--muted);font-size:13px}
    main{max-width:1120px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(300px,410px) 1fr;gap:18px}
    section{background:var(--surface);border:1px solid var(--line);border-radius:8px}.input{padding:18px;align-self:start;position:sticky;top:16px}
    label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}
    button{width:100%;min-height:42px;margin-top:16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}
    .help,.status{color:var(--muted);font-size:13px}.results{overflow:hidden}.scorebar{display:grid;grid-template-columns:145px 1fr;gap:16px;padding:18px;border-bottom:1px solid var(--line);background:#fbfcfd}
    .score{width:116px;height:116px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score,0)*1%),#e5ebf0 0);position:relative}.score:after{content:"";width:84px;height:84px;border-radius:50%;background:#fff;position:absolute}.score span{position:relative;z-index:1;font-size:28px;font-weight:900}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}.metric,.finding,.action{border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px}.metric strong{display:block;font-size:20px}.metric span{color:var(--muted);font-size:12px}
    .content{padding:18px}.empty{border:1px dashed var(--line);border-radius:8px;background:#fbfcfd;color:var(--muted);padding:16px;margin:0}.actions,.findings{display:grid;gap:10px}.action{background:#ecf7f5;border-color:#c9e7e2}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:18px 0 10px}.badge{border-radius:999px;padding:5px 7px;text-transform:uppercase;font-size:11px;font-weight:900;background:#eef3f1}.badge.high{color:var(--high);background:#fff0ee}.badge.medium{color:var(--medium);background:#fff7e8}.badge.low{color:var(--low);background:#eef8ec}.evidence{margin-top:8px;background:#f5f7f9;border:1px solid var(--line);border-radius:6px;padding:9px;overflow-wrap:anywhere;font-size:13px}
    @media(max-width:860px){.bar,main,.scorebar{display:grid;grid-template-columns:1fr}.input{position:static}main{padding:12px}}
  </style>
</head>
<body>
  <header><div class="bar"><div class="brand"><div class="mark">AEO</div><div><h1>AEO Optimizer</h1><div class="sub">URL audit for machine-liftable answer content</div></div></div><div class="sub">2026 readiness heuristics</div></div></header>
  <main>
    <section class="input">
      <form id="auditForm">
        <label for="url">Page URL</label>
        <input id="url" name="url" type="url" required placeholder="https://example.com/page">
        <p class="help">Fetches static HTML, extracts H2/H3 modules, checks schema, and verifies robots/llms files.</p>
        <button id="runButton" type="submit">Run AEO audit</button>
        <p class="status" id="status"></p>
      </form>
    </section>
    <section class="results">
      <div class="scorebar"><div><div class="score" id="scoreDial" style="--score:0"><span id="scoreValue">--</span></div><p class="sub" style="text-align:center">Readiness score</p></div><div class="metrics" id="metrics"></div></div>
      <div class="content" id="content"><p class="empty">Run an audit to see the action plan, technical readiness, and prioritized findings.</p></div>
    </section>
  </main>
  <script>
    const form=document.querySelector("#auditForm"),runButton=document.querySelector("#runButton"),statusEl=document.querySelector("#status"),scoreDial=document.querySelector("#scoreDial"),scoreValue=document.querySelector("#scoreValue"),metricsEl=document.querySelector("#metrics"),contentEl=document.querySelector("#content");
    const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const metric=(label,value)=>`<div class="metric"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`;
    function render(report){const s=report.summary;scoreDial.style.setProperty("--score",report.score);scoreValue.textContent=report.score;metricsEl.innerHTML=[metric("H2/H3 modules",s.sections),metric("Question headings",s.question_headings),metric("Direct answers",s.concise_answers),metric("Schemas",s.schemas_detected.length),metric("GPTBot blocked",s.robots.gptbot_blocked?"Yes":"No"),metric("llms.txt",s.llms_txt.found?"Found":"Missing")].join("");const actions=report.aeo_action_plan.map((item,i)=>`<div class="action"><strong>${i+1}.</strong> ${esc(item)}</div>`).join("");const findings=report.findings.map(f=>`<article class="finding"><p><span class="badge ${esc(f.severity)}">${esc(f.severity)}</span> <strong>${esc(f.category)}</strong></p><div>${esc(f.message)}</div><div class="evidence">${esc(f.evidence)}</div><p><strong>Action:</strong> ${esc(f.action)}</p></article>`).join("");contentEl.innerHTML=`<h2>AEO Action Plan</h2><div class="actions">${actions}</div><h3>Findings</h3><div class="findings">${findings||'<p class="empty">No findings returned.</p>'}</div>`}
    form.addEventListener("submit",async event=>{event.preventDefault();runButton.disabled=true;statusEl.textContent="Running audit...";try{const response=await fetch("/api/audit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:form.url.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Audit failed.");statusEl.textContent="Audit complete.";render(data)}catch(error){statusEl.textContent=error.message}finally{runButton.disabled=false}});
  </script>
</body>
</html>
